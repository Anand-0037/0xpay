name: Verify private pool wallet

on:
  push:
    branches: [work/private-pool]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check browser proof assets
        run: |
          test -s dist/circuits/withdraw.wasm
          test -s dist/circuits/withdraw_final.zkey
